<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cozy Stitch OS - Needle & Hook Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Exact Cozy Stitch OS 3D Icon Palette (Light Mode) */
    /* Couch Mode Icon: Warm Oat Cream */
    --bg: #F4EFE6;
    --tray-bg: #E7DFD3;
    --surface-top: #FAF6F0;
    --surface-bottom: #ECE3D6;
    --row-hover: #F2EAE0;
    --divider: rgba(92, 74, 60, 0.10);
    --text: #4A3E36;
    --text-muted: #8E7F74;

    /* Main Icon & Sage Hook: Muted Warm Olive-Sage */
    --sage-top: #CED7BA;
    --sage-mid: #BCC8A6;
    --sage-bot: #A1AF8B;
    --sage-text: #3A442F;

    /* Projects Icon & Sofa: Soft Apricot Peach */
    --peach-top: #EFC2A6;
    --peach-mid: #E5AE8F;
    --peach-bot: #DC9F81;
    --peach-text: #593828;

    /* Yarn Stash Icon & Rose Hook: Dusty Rose Pink */
    --rose-top: #E8B1B4;
    --rose-mid: #DE9EA2;
    --rose-bot: #D48E92;
    --rose-text: #5A2E31;

    /* Pattern Library Icon: Warm Butter Yellow */
    --honey-top: #F2DFAA;
    --honey-mid: #E9CF8E;
    --honey-bot: #DFC27C;
    --honey-text: #5C491D;

    /* Cream Clay Badge */
    --cream-top: #F2E9DC;
    --cream-bot: #DFD2C0;
    --cream-text: #57483D;

    --stitch-color: rgba(250, 246, 238, 0.68);

    /* Soft Warm 3D Clay Shadows */
    --clay-shadow:
      0 10px 20px rgba(92, 74, 60, 0.09),
      0 4px 8px rgba(92, 74, 60, 0.05),
      inset 0 4px 7px rgba(255, 253, 248, 0.72),
      inset 0 -5px 9px rgba(92, 74, 60, 0.11);

    --clay-btn-shadow:
      0 6px 12px rgba(92, 74, 60, 0.09),
      0 2px 4px rgba(92, 74, 60, 0.05),
      inset 0 3px 5px rgba(255, 253, 248, 0.70),
      inset 0 -4px 7px rgba(92, 74, 60, 0.11);

    --clay-btn-active:
      0 2px 4px rgba(92, 74, 60, 0.09),
      inset 0 3px 6px rgba(92, 74, 60, 0.15),
      inset 0 -2px 4px rgba(255, 253, 248, 0.45);

    --tray-inset:
      inset 0 3px 7px rgba(92, 74, 60, 0.11),
      inset 0 -2px 4px rgba(255, 253, 248, 0.75);

    --felt-opacity: 0.045;
  }

  /* Dark Mode (Auto + Manual Override) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #211D1A;
      --tray-bg: #181513;
      --surface-top: #342E2A;
      --surface-bottom: #282320;
      --row-hover: #3B342F;
      --divider: rgba(244, 239, 230, 0.09);
      --text: #F4EFE6;
      --text-muted: #A99E96;

      --sage-top: #74825F;
      --sage-mid: #62704F;
      --sage-bot: #4F5B3F;
      --sage-text: #F6F3EC;

      --peach-top: #C48A6D;
      --peach-mid: #B37A5E;
      --peach-bot: #A36B50;
      --peach-text: #FFF6F0;

      --rose-top: #BA7B80;
      --rose-mid: #A86B70;
      --rose-bot: #985D62;
      --rose-text: #FFF4F5;

      --honey-top: #C2A864;
      --honey-mid: #B09653;
      --honey-bot: #9E8545;
      --honey-text: #FFFBF0;

      --cream-top: #443C37;
      --cream-bot: #342E2A;
      --cream-text: #EFE8DF;

      --stitch-color: rgba(244, 239, 230, 0.28);

      --clay-shadow:
        0 12px 24px rgba(0, 0, 0, 0.34),
        0 4px 8px rgba(0, 0, 0, 0.22),
        inset 0 3px 6px rgba(255, 248, 240, 0.12),
        inset 0 -6px 10px rgba(0, 0, 0, 0.34);

      --clay-btn-shadow:
        0 6px 12px rgba(0, 0, 0, 0.30),
        0 2px 4px rgba(0, 0, 0, 0.18),
        inset 0 3px 5px rgba(255, 248, 240, 0.13),
        inset 0 -4px 7px rgba(0, 0, 0, 0.32);

      --clay-btn-active:
        0 2px 4px rgba(0, 0, 0, 0.24),
        inset 0 3px 6px rgba(0, 0, 0, 0.38),
        inset 0 -2px 4px rgba(255, 248, 240, 0.08);

      --tray-inset:
        inset 0 3px 8px rgba(0, 0, 0, 0.42),
        inset 0 -1px 3px rgba(255, 248, 240, 0.07);

      --felt-opacity: 0.055;
    }
  }

  :root[data-theme="dark"] {
    --bg: #211D1A;
    --tray-bg: #181513;
    --surface-top: #342E2A;
    --surface-bottom: #282320;
    --row-hover: #3B342F;
    --divider: rgba(244, 239, 230, 0.09);
    --text: #F4EFE6;
    --text-muted: #A99E96;

    --sage-top: #74825F;
    --sage-mid: #62704F;
    --sage-bot: #4F5B3F;
    --sage-text: #F6F3EC;

    --peach-top: #C48A6D;
    --peach-mid: #B37A5E;
    --peach-bot: #A36B50;
    --peach-text: #FFF6F0;

    --rose-top: #BA7B80;
    --rose-mid: #A86B70;
    --rose-bot: #985D62;
    --rose-text: #FFF4F5;

    --honey-top: #C2A864;
    --honey-mid: #B09653;
    --honey-bot: #9E8545;
    --honey-text: #FFFBF0;

    --cream-top: #443C37;
    --cream-bot: #342E2A;
    --cream-text: #EFE8DF;

    --stitch-color: rgba(244, 239, 230, 0.28);

    --clay-shadow:
      0 12px 24px rgba(0, 0, 0, 0.34),
      0 4px 8px rgba(0, 0, 0, 0.22),
      inset 0 3px 6px rgba(255, 248, 240, 0.12),
      inset 0 -6px 10px rgba(0, 0, 0, 0.34);

    --clay-btn-shadow:
      0 6px 12px rgba(0, 0, 0, 0.30),
      0 2px 4px rgba(0, 0, 0, 0.18),
      inset 0 3px 5px rgba(255, 248, 240, 0.13),
      inset 0 -4px 7px rgba(0, 0, 0, 0.32);

    --clay-btn-active:
      0 2px 4px rgba(0, 0, 0, 0.24),
      inset 0 3px 6px rgba(0, 0, 0, 0.38),
      inset 0 -2px 4px rgba(255, 248, 240, 0.08);

    --tray-inset:
      inset 0 3px 8px rgba(0, 0, 0, 0.42),
      inset 0 -1px 3px rgba(255, 248, 240, 0.07);

    --felt-opacity: 0.055;
  }

  button { appearance: none; -webkit-appearance: none; }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Nunito', 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }

  /* Subtle Warm Felt / Linen Grain Overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: var(--felt-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    z-index: 0;
  }

  .widget-shell {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  /* Top Mini Bar (Matched with Row Counter) */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--text-muted);
  }

  .yarn-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--sage-top), var(--sage-bot));
    box-shadow:
      0 2px 4px rgba(92, 74, 60, 0.16),
      inset 0 2px 2px rgba(255, 255, 255, 0.65);
  }

  .theme-btn {
    border: none;
    background: linear-gradient(160deg, var(--surface-top), var(--surface-bottom));
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.85rem;
    box-shadow: var(--clay-btn-shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .theme-btn:active {
    transform: translateY(1.5px) scale(0.94);
    box-shadow: var(--clay-btn-active);
  }

  /* 3D Recessed Clay Tab Tray */
  .tab-tray {
    display: flex;
    gap: 6px;
    background: var(--tray-bg);
    padding: 6px;
    border-radius: 20px;
    box-shadow: var(--tray-inset);
    flex-shrink: 0;
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    text-align: center;
    padding: 9px 4px;
    font-size: 0.84rem;
    font-weight: 800;
    border-radius: 15px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .tab-btn.active {
    box-shadow: var(--clay-btn-shadow);
    transform: translateY(-1px);
  }

  #tabKnit.active {
    background: linear-gradient(165deg, var(--sage-top), var(--sage-bot));
    color: var(--sage-text);
  }

  #tabCrochet.active {
    background: linear-gradient(165deg, var(--rose-top), var(--rose-bot));
    color: var(--rose-text);
  }

  #tabYarn.active {
    background: linear-gradient(165deg, var(--honey-top), var(--honey-bot));
    color: var(--honey-text);
  }

  /* 3D Stitched Felt Spotlight Cushion (Selected Size Preview) */
  .spotlight-pillow {
    position: relative;
    flex-shrink: 0;
    border-radius: 26px;
    padding: 16px 18px;
    box-shadow: var(--clay-shadow);
    overflow: hidden;
    transition: background 0.25s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .spotlight-pillow.pop {
    transform: scale(0.98);
  }

  .spotlight-pillow.theme-knit {
    background: radial-gradient(circle at 25% 18%, var(--sage-top) 0%, var(--sage-mid) 54%, var(--sage-bot) 100%);
    color: var(--sage-text);
  }

  .spotlight-pillow.theme-crochet {
    background: radial-gradient(circle at 25% 18%, var(--rose-top) 0%, var(--rose-mid) 54%, var(--rose-bot) 100%);
    color: var(--rose-text);
  }

  .spotlight-pillow.theme-yarn {
    background: radial-gradient(circle at 25% 18%, var(--honey-top) 0%, var(--honey-mid) 54%, var(--honey-bot) 100%);
    color: var(--honey-text);
  }

  /* Hand-Stitched Felt Rim */
  .spotlight-pillow::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 19px;
    border: 2px dashed var(--stitch-color);
    pointer-events: none;
  }

  /* Wool Felt Grain */
  .spotlight-pillow::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
  }

  .spot-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .spot-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .spot-kicker {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    opacity: 0.78;
  }

  .spot-main {
    font-size: 1.65rem;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.6px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.30);
  }

  .spot-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .spot-chip {
    padding: 4px 11px;
    border-radius: 999px;
    background: rgba(255, 253, 248, 0.36);
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.45);
    font-size: 0.78rem;
    font-weight: 800;
  }

  /* 3D Clay List Container */
  .list-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(165deg, var(--surface-top), var(--surface-bottom));
    border-radius: 26px;
    padding: 13px 12px 10px;
    box-shadow: var(--clay-shadow);
    overflow: hidden;
  }

  .table-header {
    display: grid;
    grid-template-columns: 1.15fr 1fr 0.85fr;
    padding: 0 10px 9px;
    border-bottom: 1.5px dashed var(--divider);
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.55px;
    flex-shrink: 0;
  }

  .table-header.two-col {
    grid-template-columns: 1.15fr 1.25fr;
  }

  .th-center { text-align: center; }
  .th-right { text-align: right; }

  .scroll-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 2px 4px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .scroll-list::-webkit-scrollbar {
    width: 5px;
  }

  .scroll-list::-webkit-scrollbar-thumb {
    background: var(--tray-bg);
    border-radius: 999px;
  }

  /* Tactile Clay List Row */
  .list-row {
    display: grid;
    grid-template-columns: 1.15fr 1fr 0.85fr;
    align-items: center;
    padding: 9px 10px;
    border-radius: 15px;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
    transition: transform 0.12s ease, background 0.16s ease, box-shadow 0.16s ease;
  }

  .list-row.two-col {
    grid-template-columns: 1.15fr 1.25fr;
  }

  .list-row:hover {
    background: var(--row-hover);
  }

  .list-row:active {
    transform: scale(0.985);
  }

  .list-row.selected {
    background: linear-gradient(165deg, var(--peach-top), var(--peach-bot));
    color: var(--peach-text);
    box-shadow: var(--clay-btn-shadow);
  }

  .list-row.selected .col-sub,
  .list-row.selected .col-uk {
    color: var(--peach-text);
    opacity: 0.9;
  }

  .col-main {
    font-size: 0.94rem;
    font-weight: 900;
  }

  .col-sub {
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--text);
    text-align: center;
  }

  .list-row.two-col .col-sub {
    text-align: right;
    font-size: 0.84rem;
    color: var(--text-muted);
  }

  .list-row.two-col.selected .col-sub {
    color: var(--peach-text);
  }

  .col-uk {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-muted);
    text-align: right;
  }

  .mini-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--tray-bg);
    box-shadow: var(--tray-inset);
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--text);
  }

  .list-row.selected .mini-pill {
    background: rgba(255, 253, 248, 0.35);
    box-shadow: none;
    color: var(--peach-text);
  }

  .hidden { display: none; }
</style>
</head>
<body>

  <div class="widget-shell">
    <!-- Top Mini Bar -->
    <div class="top-bar">
      <div class="brand-pill">
        <span class="yarn-dot"></span>
        <span>SIZE CONVERTER</span>
      </div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle Light / Dark Mode" aria-label="Toggle theme">🌙</button>
    </div>

    <!-- 3D Recessed Clay Tabs -->
    <div class="tab-tray" role="tablist">
      <button class="tab-btn active" id="tabKnit" onclick="showTab('Knit')">🥢 Needles</button>
      <button class="tab-btn" id="tabCrochet" onclick="showTab('Crochet')">🧶 Hooks</button>
      <button class="tab-btn" id="tabYarn" onclick="showTab('Yarn')">🧺 Yarn</button>
    </div>

    <!-- 3D Stitched Felt Spotlight Card -->
    <div class="spotlight-pillow theme-knit" id="spotlightCard">
      <div class="spot-inner">
        <div class="spot-top">
          <span class="spot-kicker" id="spotKicker">Knitting Needle Size</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" opacity="0.72" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/>
            <path d="M7.5 16.5L16.5 7.5M8.5 7.5L15.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="spot-main" id="spotMain">4.0 mm = US 6</div>
        <div class="spot-chips" id="spotChips"></div>
      </div>
    </div>

    <!-- 3D Clay Scrollable List Card -->
    <div class="list-card">
      <!-- Knitting Needles -->
      <div id="headerKnit" class="table-header">
        <span>Metric</span>
        <span class="th-center">US Size</span>
        <span class="th-right">UK Size</span>
      </div>
      <div id="listKnit" class="scroll-list"></div>

      <!-- Crochet Hooks -->
      <div id="headerCrochet" class="table-header hidden">
        <span>Metric</span>
        <span class="th-center">US Letter</span>
        <span class="th-right">UK Size</span>
      </div>
      <div id="listCrochet" class="scroll-list hidden"></div>

      <!-- Yarn Weights -->
      <div id="headerYarn" class="table-header two-col hidden">
        <span>Weight Class</span>
        <span class="th-right">Recommended Gauge</span>
      </div>
      <div id="listYarn" class="scroll-list hidden"></div>
    </div>
  </div>

<script>
  const needles = [
    { mm: "2.0 mm",  us: "US 0",    uk: "UK 14" },
    { mm: "2.25 mm", us: "US 1",    uk: "UK 13" },
    { mm: "2.75 mm", us: "US 2",    uk: "UK 12" },
    { mm: "3.0 mm",  us: "US 2.5",  uk: "UK 11" },
    { mm: "3.25 mm", us: "US 3",    uk: "UK 10" },
    { mm: "3.5 mm",  us: "US 4",    uk: "—"     },
    { mm: "3.75 mm", us: "US 5",    uk: "UK 9"  },
    { mm: "4.0 mm",  us: "US 6",    uk: "UK 8"  },
    { mm: "4.5 mm",  us: "US 7",    uk: "UK 7"  },
    { mm: "5.0 mm",  us: "US 8",    uk: "UK 6"  },
    { mm: "5.5 mm",  us: "US 9",    uk: "UK 5"  },
    { mm: "6.0 mm",  us: "US 10",   uk: "UK 4"  },
    { mm: "6.5 mm",  us: "US 10.5", uk: "UK 3"  },
    { mm: "8.0 mm",  us: "US 11",   uk: "UK 0"  },
    { mm: "9.0 mm",  us: "US 13",   uk: "UK 00" },
    { mm: "10.0 mm", us: "US 15",   uk: "UK 000"},
    { mm: "12.0 mm", us: "US 17",   uk: "—"     }
  ];

  const hooks = [
    { mm: "2.25 mm", us: "B-1",     uk: "UK 13" },
    { mm: "2.75 mm", us: "C-2",     uk: "UK 12" },
    { mm: "3.25 mm", us: "D-3",     uk: "UK 10" },
    { mm: "3.5 mm",  us: "E-4",     uk: "UK 9"  },
    { mm: "3.75 mm", us: "F-5",     uk: "—"     },
    { mm: "4.0 mm",  us: "G-6",     uk: "UK 8"  },
    { mm: "4.5 mm",  us: "7",       uk: "UK 7"  },
    { mm: "5.0 mm",  us: "H-8",     uk: "UK 6"  },
    { mm: "5.5 mm",  us: "I-9",     uk: "UK 5"  },
    { mm: "6.0 mm",  us: "J-10",    uk: "UK 4"  },
    { mm: "6.5 mm",  us: "K-10.5",  uk: "UK 3"  },
    { mm: "8.0 mm",  us: "L-11",    uk: "UK 0"  },
    { mm: "9.0 mm",  us: "M/N-13",  uk: "UK 00" },
    { mm: "10.0 mm", us: "N/P-15",  uk: "UK 000"}
  ];

  const yarns = [
    { w: "0 - Lace",        n: "1.5 – 2.25 mm", h: "1.5 – 2.25 mm", ply: "2-Ply • Delicate" },
    { w: "1 - Fingering",   n: "2.25 – 3.25 mm", h: "2.25 – 3.5 mm", ply: "4-Ply • Sock" },
    { w: "2 - Sport",       n: "3.25 – 3.75 mm", h: "3.5 – 4.5 mm",  ply: "5-Ply • Fine" },
    { w: "3 - DK",          n: "3.75 – 4.5 mm",  h: "4.5 – 5.5 mm",  ply: "8-Ply • Light" },
    { w: "4 - Worsted",     n: "4.5 – 5.5 mm",   h: "5.5 – 6.5 mm",  ply: "10-Ply • Aran" },
    { w: "5 - Bulky",       n: "5.5 – 8.0 mm",   h: "6.5 – 9.0 mm",  ply: "12-Ply • Chunky" },
    { w: "6 - Super Bulky", n: "8.0+ mm",        h: "9.0+ mm",       ply: "Roving • Jumbo" }
  ];

  let activeTab = 'Knit';
  const selectedIndex = { Knit: 7, Crochet: 5, Yarn: 3 }; // Default: 4.0mm / G-6 / 3 - DK

  // Shared Theme System with Row Counter (localStorage key: 'cozyTheme')
  let savedTheme = localStorage.getItem('cozyTheme');
  function applyTheme() {
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = savedTheme ? savedTheme === 'dark' : systemDark;

    if (savedTheme) {
      root.setAttribute('data-theme', savedTheme);
    } else {
      root.removeAttribute('data-theme');
    }
    btn.textContent = isDark ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const currentlyDark = savedTheme ? savedTheme === 'dark' : systemDark;
    savedTheme = currentlyDark ? 'light' : 'dark';
    localStorage.setItem('cozyTheme', savedTheme);
    applyTheme();
  }

  function updateSpotlight(animate = false) {
    const card = document.getElementById('spotlightCard');
    const kicker = document.getElementById('spotKicker');
    const main = document.getElementById('spotMain');
    const chips = document.getElementById('spotChips');

    card.classList.remove('theme-knit', 'theme-crochet', 'theme-yarn');

    if (activeTab === 'Knit') {
      const item = needles[selectedIndex.Knit];
      card.classList.add('theme-knit');
      kicker.textContent = 'Knitting Needle Match';
      main.textContent = `${item.mm}  =  ${item.us}`;
      chips.innerHTML = `
        <span class="spot-chip">Metric ${item.mm}</span>
        <span class="spot-chip">${item.us}</span>
        <span class="spot-chip">${item.uk === '—' ? 'No exact UK' : item.uk}</span>
      `;
    } else if (activeTab === 'Crochet') {
      const item = hooks[selectedIndex.Crochet];
      card.classList.add('theme-crochet');
      kicker.textContent = 'Crochet Hook Match';
      main.textContent = `${item.mm}  =  US ${item.us}`;
      chips.innerHTML = `
        <span class="spot-chip">Metric ${item.mm}</span>
        <span class="spot-chip">US ${item.us}</span>
        <span class="spot-chip">${item.uk === '—' ? 'No exact UK' : item.uk}</span>
      `;
    } else {
      const item = yarns[selectedIndex.Yarn];
      card.classList.add('theme-yarn');
      kicker.textContent = 'Yarn Weight Guide';
      main.textContent = item.w;
      chips.innerHTML = `
        <span class="spot-chip">🥢 ${item.n}</span>
        <span class="spot-chip">🧶 ${item.h}</span>
        <span class="spot-chip">${item.ply}</span>
      `;
    }

    if (animate) {
      card.classList.add('pop');
      setTimeout(() => card.classList.remove('pop'), 140);
    }
  }

  function selectRow(tab, idx) {
    selectedIndex[tab] = idx;
    renderAllLists();
    updateSpotlight(true);
  }

  function renderAllLists() {
    document.getElementById('listKnit').innerHTML = needles.map((item, idx) => `
      <button class="list-row${selectedIndex.Knit === idx ? ' selected' : ''}" onclick="selectRow('Knit', ${idx})">
        <span class="col-main">${item.mm}</span>
        <span class="col-sub"><span class="mini-pill">${item.us}</span></span>
        <span class="col-uk">${item.uk}</span>
      </button>
    `).join('');

    document.getElementById('listCrochet').innerHTML = hooks.map((item, idx) => `
      <button class="list-row${selectedIndex.Crochet === idx ? ' selected' : ''}" onclick="selectRow('Crochet', ${idx})">
        <span class="col-main">${item.mm}</span>
        <span class="col-sub"><span class="mini-pill">${item.us}</span></span>
        <span class="col-uk">${item.uk}</span>
      </button>
    `).join('');

    document.getElementById('listYarn').innerHTML = yarns.map((item, idx) => `
      <button class="list-row two-col${selectedIndex.Yarn === idx ? ' selected' : ''}" onclick="selectRow('Yarn', ${idx})">
        <span class="col-main">${item.w}</span>
        <span class="col-sub">${item.n}</span>
      </button>
    `).join('');
  }

  function showTab(tab) {
    activeTab = tab;

    ['Knit', 'Crochet', 'Yarn'].forEach(t => {
      const isCurrent = t === tab;
      document.getElementById(`tab${t}`).classList.toggle('active', isCurrent);
      document.getElementById(`header${t}`).classList.toggle('hidden', !isCurrent);
      document.getElementById(`list${t}`).classList.toggle('hidden', !isCurrent);
    });

    updateSpotlight(true);
  }

  applyTheme();
  renderAllLists();
  updateSpotlight(false);
</script>
</body>
</html>
